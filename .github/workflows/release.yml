name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build and package
        run: ./build-app.sh

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent MacStats.app MacStats.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacStats.zip
          generate_release_notes: true
